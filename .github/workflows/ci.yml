name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -p pytest_asyncio.plugin
        env:
          APP_ENV: test
          DATABASE_CLOUD: "false"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          node tests/frontend/report-editor-check.mjs
          node tests/frontend/v2-client-check.mjs
          node -e "const fs = require('node:fs'); const cp = require('node:child_process'); for (const file of fs.readdirSync('frontend/tests').filter(name => name.endsWith('regression.cjs')).sort()) cp.execFileSync(process.execPath, ['tests/' + file], { cwd: 'frontend', stdio: 'inherit' });"
          npm --prefix frontend run build
